version: "1.0"
title: req-mindmap - プロジェクト要求/要件
description: このリポジトリ自身のユーザー要求とシステム要件のサンプル
metadata:
  templateType: requirements
  createdAt: "2025-01-10T00:00:00Z"
  updatedAt: "2025-01-10T00:00:00Z"
root:
  id: root
  title: 要求と要件
  description: ユーザー要求からシステム要件へのブレークダウン
  children:
    - id: user-req
      title: ユーザー要求
      description: ユーザー（開発者/要件定義者）が達成したいこと
      children:
        - id: ur-1
          title: ローカルで高速に動く
          description: ネットワーク無しでサクサク編集・閲覧できる
          priority: high
          status: in-progress
        - id: ur-2
          title: Gitで履歴管理したい
          description: テキスト（YAML/JSON）で要件を扱い、差分が見える
          priority: high
          status: done
        - id: ur-3
          title: VSCodeワークフローに統合されたい
          description: Webview/拡張と自然に連携し、キーボード中心の操作
          priority: medium
          status: pending
    - id: system-req
      title: システム要件
      description: 製品が備えるべき具体的な機能/品質
      children:
        - id: sr-1
          title: YAML/JSONパースとZod検証
          description: Zodベース＋将来のAjv併用に対応
          priority: high
          status: done
        - id: sr-2
          title: 大規模データのパフォーマンス
          description: 仮想化・メモリ監視・計測により体感を最適化
          priority: medium
          status: in-progress
        - id: sr-3
          title: 文書タイプ（Requirements/Stakeholders/Design/Tasks）
          description: プラグイン可能なDocumentType管理と依存関係解決
          priority: medium
          status: done

