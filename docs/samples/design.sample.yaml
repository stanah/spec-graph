title: req-mindmap 設計
version: "1.0.0"
components:
  - id: DSGN-CORE
    name: Core
    type: module
    responsibilities: 状態/描画/ID/依存関係の中核
    techStack: [typescript, d3]
    criticality: high
    children:
      - id: DSGN-LOGIC
        name: Logic
        type: module
        responsibilities: 状態遷移・イベント処理
        techStack: [typescript]
        criticality: high
      - id: DSGN-PARSER
        name: Parser
        type: service
        responsibilities: JSON/YAML解析・検証
        techStack: [typescript, zod]
        criticality: high
  - id: DSGN-SERVICES
    name: Services
    type: service
    responsibilities: スキーマ管理/テンプレート/読み込み
    dependencies: [DSGN-CORE]
    techStack: [typescript, zod, ajv]
    criticality: high
  - id: DSGN-VSCODE
    name: VSCode Extension
    type: adapter
    responsibilities: Webview/Tree/Editor 連携
    dependencies: [DSGN-SERVICES]
    techStack: [typescript, vscode-api]
    criticality: medium

