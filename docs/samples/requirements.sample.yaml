    to: ED-SYNC-001
    relationship: "プレビューペインは同期機能に依存"
    
  - from: VS-FILE-001
    to: VS-VIEW-001
    relationship: "ファイル操作はビュー自動切り替えをトリガー"
    
  # データ管理の関連性
  - from: DM-TYPE-001
    to: DM-SCHM-001
    relationship: "ドキュメントタイプはスキーマ定義に基づく"
    
  - from: DM-DEPS-001
    to: FT-DEPS-001
    relationship: "依存関係管理がビジュアライザーの基盤"
    
  # 非機能要件との関連性
