title: spec-graph 要件ドキュメント
version: "2.0.0"
lastUpdated: "2025-01-07"

projectOverview:
  description: |
    要求定義・要件定義を効率的に進めるためのマインドマップツール。
    JSON/YAML形式でのテキストベース管理と、リアルタイムでの視覚的なマインドマップ表示を提供する。
  status: "開発中（メインコア機能実装完了、高度な機能の開発継続中）"
  
goals:
  primary:
    - ローカルで高速・安定の要件編集体験
    - Gitベースの差分レビューしやすさ
    - VSCodeワークフローへの自然な統合
    - 文書タイプ別の最適化と拡張性
  secondary:
    - 複数ビュー形式での要件可視化
    - 依存関係管理と整合性チェック
    - エクスポート・共有機能の充実

