<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spec Graph Viewer - Browser</title>

  <!-- ブラウザ用のCSP設定 -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    font-src 'self' data:;
    connect-src 'self' https:;
  ">

  <!-- PWA対応 -->
  <meta name="theme-color" content="#007acc" />
  <meta name="description" content="Requirements specification graph viewer" />

  <!-- アイコン -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- フォント -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    code {
      font-family: 'Courier New', Courier, monospace;
    }

    /* ライトモード */
    :root {
      --primary-color: #007acc;
      --primary-color-hover: #005a9e;
      --secondary-color: #5a5a5a;
      --text-color: #333333;
      --text-secondary: #666666;
      --background-color: #ffffff;
      --header-background: #f5f5f5;
      --border-color: #e0e0e0;
    }

    /* ダークモード */
    @media (prefers-color-scheme: dark) {
      :root {
        --primary-color: #0e639c;
        --primary-color-hover: #1177bb;
        --secondary-color: #969696;
        --text-color: #d4d4d4;
        --text-secondary: #969696;
        --background-color: #1e1e1e;
        --header-background: #252526;
        --border-color: #3e3e3e;
      }
    }

    /* 初期ローディング画面 */
    .initial-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: var(--background-color);
      color: var(--text-color);
      gap: 16px;
    }

    .initial-loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-color);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- 初期ローディング画面 -->
    <div class="initial-loading">
      <div class="initial-loading-spinner"></div>
      <p>読み込み中...</p>
    </div>
  </div>

  <script type="module" src="/src/main.browser.tsx"></script>
</body>
</html>
